name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  VITE_GATEWAY_URL: ${{ vars.VITE_GATEWAY_URL }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
  VITE_MAP_ENABLED: ${{ vars.VITE_MAP_ENABLED || 'false' }}
  VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL }}
  VITE_MAP_ATTRIBUTION: ${{ vars.VITE_MAP_ATTRIBUTION }}
  VITE_MAP_PROVIDER_NAME: ${{ vars.VITE_MAP_PROVIDER_NAME }}
  VITE_LEGAL_HOLDER: ${{ vars.VITE_LEGAL_HOLDER }}
  VITE_LEGAL_TAX_ID: ${{ secrets.VITE_LEGAL_TAX_ID }}
  VITE_LEGAL_ADDRESS: ${{ vars.VITE_LEGAL_ADDRESS }}
  VITE_LEGAL_EMAIL: ${{ vars.VITE_LEGAL_EMAIL }}
  VITE_LEGAL_DPO: ${{ vars.VITE_LEGAL_DPO }}

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run verify

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist
          retention-days: 7

  android:
    name: android
    runs-on: ubuntu-latest
    needs: verify
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Puertas de publicación (LEGAL.md y blockers.md §B5)
        run: |
          npm run check:legal
          npm run check:tiles

      - run: npm run build

      - run: npx cap sync android

      - name: Restore the release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Assemble release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        working-directory: app/android
        run: ./gradlew assembleRelease

      - name: Check that release ships no cleartext exception
        run: |
          aapt2=$(find "$ANDROID_HOME/build-tools" -name 'aapt2' -type f | sort -V | tail -1)
          apk=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "Comprobando $apk"
          if "$aapt2" dump resources "$apk" | grep -q network_security_config; then
            echo "El APK de release no puede llevar network_security_config.xml (MOBILE.md 5.3)"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: app/android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  ios:
    name: ios
    runs-on: macos-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run build

      - run: npx cap sync ios

      - name: Build for the simulator without signing
        working-directory: app/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -target App \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build
